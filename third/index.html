<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exchange Rate Converter</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; }
    input, select, button { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
    #result { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Currency Converter</h2>

  <label>Amount:</label>
  <input type="number" id="amount" value="1" min="0">

  <label>From:</label>
  <input type="text" id="fromCurrency" value="USD" style="text-transform: uppercase;">

  <label>To:</label>
  <input type="text" id="toCurrency" value="EUR" style="text-transform: uppercase;">

  <button onclick="convertCurrency()">Convert</button>

  <div id="result"></div>

  <script>
    async function convertCurrency() {
      const amount = document.getElementById('amount').value;
      const from = document.getElementById('fromCurrency').value.toUpperCase();
      const to = document.getElementById('toCurrency').value.toUpperCase();
      const resultDiv = document.getElementById('result');

      resultDiv.innerText = "Fetching rate...";

      try {
        const response = await fetch(`/api/rates/${from}`);
        const data = await response.json();

        if (data.success && data.rates[to]) {
          const convertedAmount = (amount * data.rates[to]).toFixed(2);
          resultDiv.innerText = `${amount} ${from} = ${convertedAmount} ${to}`;
        } else {
          resultDiv.innerText = "Error: Invalid currency code or rate unavailable.";
        }
      } catch (err) {
        resultDiv.innerText = "Error connecting to server.";
      }
    }
  </script>

</body>
</html>
